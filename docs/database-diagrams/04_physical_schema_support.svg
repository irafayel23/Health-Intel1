rt">account_key</text><text x="273" y="479" font-family="Times New Roman,serif" font-size="9.2" font-weight="400" fill="#161616" text-anchor="start">CHAR(64)</text><text x="361" y="479" font-family="Times New Roman,serif" font-size="9.5" font-weight="400" fill="#161616" text-anchor="start">-</text><text x="44" y="493" font-family="Times New Roman,serif" font-size="9.2" font-weight="700" fill="#161616" text-anchor="start"></text><text x="89" y="493" font-family="Times New Roman,serif" font-size="10" font-weight="400" fill="#161616" text-anchor="start">failure_count</text><text x="273" y="493" font-family="Times New Roman,serif" font-size="9.2" font-weight="400" fill="#161616" text-anchor="start">TINYINT(3) U</text><text x="361" y="493" font-family="Times New Roman,serif" font-size="9.5" font-weight="400" fill="#161616" text-anchor="start">-</text><text x="44" y="507" font-family="Times New Roman,serif" font-size="9.2" font-weight="700" fill="#161616" text-anchor="start"></text><text x="89" y="507" font-family="Times New Roman,serif" font-size="10" font-weight="400" fill="#161616" text-anchor="start">lock_level</text><text x="273" y="507" font-family="Times New Roman,serif" font-size="9.2" font-weight="400" fill="#161616" text-anchor="start">TINYINT(3) U</text><text x="361" y="507" font-family="Times New Roman,serif" font-size="9.5" font-weight="400" fill="#161616" text-anchor="start">-</text><text x="44" y="521" font-family="Times New Roman,serif" font-size="9.2" font-weight="700" fill="#161616" text-anchor="start"></text><text x="89" y="521" font-family="Times New Roman,serif" font-size="10" font-weight="400" fill="#161616" text-anchor="start">blocked_until</text><text x="273" y="521" font-family="Times New Roman,serif" font-size="9.2" font-weight="400" fill="#161616" text-anchor="start">BIGINT(20) U</text><text x="361" y="521" font-family="Times New Roman,serif" font-size="9.5" font-weight="400" fill="#161616" text-anchor="start">-</text><rect x="420" y="97" width=