size="9.5" font-weight="700" fill="#161616" text-anchor="start">N</text><polyline points="805,142 1155,142" fill="none" stroke="#c5d0dc" stroke-width="0.6"/><text x="814" y="155" font-family="Times New Roman,serif" font-size="9.2" font-weight="700" fill="#161616" text-anchor="start">PK</text><text x="859" y="155" font-family="Times New Roman,serif" font-size="10" font-weight="400" fill="#161616" text-anchor="start">id</text><text x="1043" y="155" font-family="Times New Roman,serif" font-size="9.2" font-weight="400" fill="#161616" text-anchor="start">INT(11)</text><text x="1131" y="155" font-family="Times New Roman,serif" font-size="9.5" font-weight="400" fill="#161616" text-anchor="start">-</text><text x="814" y="169" font-family="Times New Roman,serif" font-size="9.2" font-weight="700" fill="#161616" text-anchor="start">FK</text><text x="859" y="169" font-family="Times New Roman,serif" font-size="10" font-weight="400" fill="#161616" text-anchor="start">barangay_id</text><text x="1043" y="169" font-family="Times New Roman,serif" font-size="9.2" font-weight="400" fill="#161616" text-anchor="start">INT(11)</text><text x="1131" y="169" font-family="Times New Roman,serif" font-size="9.5" font-weight="400" fill="#161616" text-anchor="start">Y</text><text x="814" y="183" font-family="Times New Roman,serif" font-size="9.2" font-weight="700" fill="#161616" text-anchor="start">FK</text><text x="859" y="183" font-family="Times New Roman,serif" font-size="10" font-weight="400" fill="#161616" text-anchor="start">disease_id</text><text x="1043" y="183" font-family="Times New Roman,serif" font-size="9.2" font-weight="400" fill="#161616" text-anchor="start">INT(11)</text><text x="1131" y="183" font-family="Times New Roman,serif" font-size="9.5" font-weight="400" fill="#161616" text-anchor="start">Y</text><text x="814" y="197" font-family="Times New Roman,serif" font-size="9.2" font-weight="700" fill="#161616" text-anchor="start"></text><text x="859" y="197" font-family="Times New Roman,serif" font-size="10" font-weight="400" fill="#161616" text-anchor="start">predicted_date</text><text x="1043" y="197" font-family="Times New Roman,serif" font-size="9.2" font-weight="400" fill="#161616" text-anchor="start">DATE</text><text x="1131" y="197" font-family="Times New Roman,serif" font-size="9.5" font-weight="400" fill="#161616" text-anchor="start">Y</text><text x="814" y="211" font-family="Times New Roman,serif" font-size="9.2" font-weight="700" fill="#161616" text-anchor="start"></text><text x="859" y="211" font-family="Times New Roman,serif" font-size="10" font-weight="400" fill="#161616" text-anchor="start">predicted_cases</text><text x="1043" y="211" font-family="Times New Roman,serif" font-size="9.2" font-weight="400" fill="#161616" text-anchor="start">FLOAT</text><text x="1131" y="211" font-family="Times New Roman,serif" font-size="9.5" font-weight="400" fill="#161616" text-anchor="start">Y</text><text x="814" y="225" font-family="Times New Roman,serif" font-size="9.2" font-weight="700" fill="#161616" text-anchor="start"></text><text x="859" y="225" font-family="Times New Roman,serif" font-size="10" font-weight="400" fill="#161616" text-anchor="start">confidence_lower_bound</text><text x="1043" y="225" font-family="Times New Roman,serif" font-size="9.2" font-weight="400" fill="#161616" text-anchor="start">FLOAT</text><text x="1131" y="225" font-family="Times New Roman,serif" font-size="9.5" font-weight="400" fill="#161616" text-anchor="start">Y</text><text x="814" y="239" font-family="Times New Roman,serif" font-size="9.2" font-weight="700" fill="#161616" text-anchor="start"></text><text x="859" y="239" font-family="Times New Roman,serif" font-size="10" font-weight="400" fill="#161616" text-anchor="start">confidence_upper_bound</text><text x="1043" y="239" font-family="Times New Roman,serif" font-size="9.2" font-weight="400" fill="#161616" text-anchor="start">FLOAT</text><text x="1131" y="239" font-family="Times New Roman,serif" font-size="9.5" font-weight="400" fill="#161616" text-anchor="start">Y</text><text x="814" y="253" font-family="Times New Roman,serif" font-size="9.2" font-weight="700" fill="#161616" text-anchor="start"></text><text x="859" y="253" font-family="Times New Roman,serif" font-size="10" font-weight="400" fill="#161616" text-anchor="start">generated_at</text><text x="1043" y="253" font-family="Times New Roman,serif" font-size="9.2" font-weight="400" fill="#161616" text-anchor="start">DATETIME</text><text x="1131" y="253" font-family="Times New Roman,serif" font-size="9.5" font-weight="400" fill="#161616" text-anchor="start">Y</text><text x="815" y="266" font-family="Times New Roman,serif" font-size="9" font-weight="400" fill="#3f526c" text-anchor="start">barangay_id -&gt; barangays.id</text><text x="815" y="278" font-family="Times New Roman,serif" font-size="9" font-weight="400" fill="#3f526c" text-anchor="start">disease_id -&gt; disease_registry.id</text><text x="420" y="357" font-family="Times New Roman,serif" font-size="13" font-weight="700" fill="#161616" text-anchor="start">Legacy table does not mean forecasts are saved</text><text x="420" y="381" font-family="Times New Roman,serif" font-size="12" font-weight="400" fill="#333333" text-anchor="start">The predictions table exists and is included for physical-schema completeness. The current /api/predict request returns a Python-generated</text><text x="420" y="399" font-family="Times New Roman,serif" font-size="12" font-weight="400" fill="#333333" text-anchor="start">demonstration response; no insert into this table was found in that route or engine.</text><text x="420" y="502" font-family="Times New Roman,serif" font-size="13" font-weight="700" fill="#161616" text-anchor="start">Session and audit references</text><text x="420" y="526" font-family="Times New Roman,serif" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">account_session_epochs.system_id associates an account with its session version. revoked_api_sessions stores token hashes and expiry times.</text><text x="420" y="543" font-family="Times New Roman,serif" font-size="11.5" font-weight="400" fill="#333333" text-anchor="start">login_attempt_limits stores throttling keys and counters. No declared foreign keys were returned for these three tables or password_resets.</text><text x="35" y="648" font-family="Times New Roman,serif" font-size="11" font-weight="400" fill="#333333" text-anchor="start">All 14 current tables are represented across pages 2-4. Column names, types, nullability, primary keys, unique keys and all 12 declared foreign keys were checked using information_schema metadata. MUL denotes an index in MySQL metadata; it</text><text x="35" y="664" font-family="Times New Roman,serif" font-size="11" font-weight="400" fill="#333333" text-anchor="start">is not treated as proof of a foreign key.</text><text x="35" y="723" font-family="Times New Roman,serif" font-size="11" font-weight="400" fill="#333333" text-anchor="start">Use pages 2-4 as the detailed schema appendix. For the main architecture discussion, use the simpler overview on page 1. Recheck metadata before submission if a migration changes the database.</text><polyline points="35,790 1155,790" fill="none" stroke="#d2d7df" stroke-width="1"/><text x="35" y="807" font-family="Times New Roman,serif" font-size="9.5" font-weight="400" fill="#444444" text-anchor="start">Local schema verified 19 October 2026. Metadata only; no patient records included.</text><text x="1155" y="807" font-family="Times New Roman,serif" font-size="10" font-weight="400" fill="#161616" text-anchor="end">4</text></svg>