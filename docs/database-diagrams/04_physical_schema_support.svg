<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="842" viewBox="0 0 1190 842"><rect x="0" y="0" width="1190" height="842" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width=".7"/><text x="35" y="37" font-family="Times New Roman,serif" font-size="22" font-weight="700" fill="#161616" text-anchor="start">HEALTH-INTEL Supporting Schema</text><text x="35" y="58" font-family="Times New Roman,serif" font-size="11" font-weight="400" fill="#404040" text-anchor="start">Authentication, session protection and the existing legacy predictions table</text><rect x="35" y="97" width="350" height="75" rx="3" fill="#ffffff" stroke="#9aaabe" stroke-width=".7"/><rect x="35" y="97" width="350" height="27" rx="3" fill="#f0eafa" stroke="#9aaabe" stroke-width=".7"/><text x="45" y="115" font-family="Times New Roman,serif" font-size="13" font-weight="700" fill="#161616" text-anchor="start">account_session_epochs</text><text x="44" y="137" font-family="Times New Roman,serif" font-size="9.5" font-weight="700" fill="#161616" text-anchor="start">Key</text><text x="89" y="137" font-family="Times New Roman,serif" font-size="9.5" font-weight="700" fill="#161616" text-anchor="start">Column</text><text x="273" y="137" font-family="Times New Roman,serif" font-size="9.5" font-weight="700" fill="#161616" text-anchor="start">Type</text><text x="361" y="137" font-family="Times New Roman,serif" font-size="9.5" font-weight="700" fill="#161616" text-anchor="start">N</text><polyline points="35,142 385,142" fill="none" stroke="#c5d0dc" stroke-width="0.6"/><text x="44" y="155" font-family="Times New Roman,serif" font-size="9.2" font-weight="700" fill="#161616" text-anchor="start">PK</text><text x="89" y="155" font-family="Times New Roman,serif" font-size="10" font-weight="400" fill="#161616" text-anchor="start">system_id</text><text x="273" y="155" font-family="Times New Roman,serif" font-size="9.2" font-weight="400" fill="#161616" text-anchor="start">VARCHAR(50)</text><text x="361" y="155" font-fami